# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clean unused and oversized files before Pages packaging
        run: |
          rm -rf .agent .agents .claude .gemini
          rm -f index_sauvegarde_*.html
          find . -type f -name "*Outlook*.pdf" -delete
          rm -rf "OI/a5_mrprb/Ressources/Methodologie_de_resolution_de_probleme"
          rm -rf "OI/a7_flexsim/Supports_Enseignement_FlexSim_24.0"
          rm -f "OI/a7_flexsim/AppliedSimulationEdition5.pdf"
          rm -rf "OI/jeu_puissance_7/Clé USB Puissance 7"
          rm -f "OI/jeu_puissance_7/Project_P7/Puissance 7/Guide d'animation PUISSANCE 7.pptx"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
