<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Évaluation Finale — Formation SPC/Capabilité</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.15));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .header .badge {
            display: inline-block;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.05em;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            border-radius: 3px;
            transition: width 0.5s;
            width: 0%;
        }

        .question-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }

        .question-card.correct {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.05);
        }

        .question-card.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .q-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.8em;
        }

        .q-cat {
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .cat-cap {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }

        .cat-cc {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
        }

        .cat-att {
            background: rgba(20, 184, 166, 0.2);
            color: #2dd4bf;
        }

        .cat-int {
            background: rgba(249, 115, 22, 0.2);
            color: #fb923c;
        }

        .q-text {
            font-size: 0.95em;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 15px;
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.3);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.9em;
        }

        .option:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .option.selected {
            background: rgba(168, 85, 247, 0.2);
            border-color: #a855f7;
        }

        .option.right {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
        }

        .option.wrong {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            opacity: 0.7;
        }

        .radio {
            width: 18px;
            height: 18px;
            border: 2px solid #475569;
            border-radius: 50%;
            flex-shrink: 0;
            position: relative;
            transition: all 0.25s;
        }

        .option.selected .radio {
            border-color: #a855f7;
        }

        .option.selected .radio::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 8px;
            height: 8px;
            background: #a855f7;
            border-radius: 50%;
        }

        .option.right .radio {
            border-color: #22c55e;
        }

        .option.right .radio::after {
            content: '✓';
            position: absolute;
            top: -3px;
            left: 1px;
            font-size: 13px;
            color: #22c55e;
        }

        .exp {
            display: none;
            margin-top: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.85em;
            line-height: 1.5;
        }

        .exp.show {
            display: block;
        }

        .exp.ok {
            background: rgba(34, 197, 94, 0.1);
            border-left: 3px solid #22c55e;
            color: #86efac;
        }

        .exp.ko {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            display: none;
            text-align: center;
            padding: 35px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            margin-top: 25px;
        }

        .result.show {
            display: block;
        }

        .score-ring {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
            font-weight: 800;
            border: 4px solid;
        }

        .score-ring.g {
            border-color: #22c55e;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        .score-ring.m {
            border-color: #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        .score-ring.l {
            border-color: #ef4444;
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .result h2 {
            font-size: 1.4em;
            margin-bottom: 8px;
        }

        .result p {
            color: #94a3b8;
        }

        .cat-scores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
            text-align: left;
        }

        .cat-score {
            padding: 12px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.3);
        }

        .cat-score .label {
            font-size: 0.8em;
            color: #94a3b8;
        }

        .cat-score .val {
            font-size: 1.1em;
            font-weight: 700;
            margin-top: 3px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #c084fc;
            text-decoration: none;
            font-weight: 600;
        }
            .logo-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            margin-bottom: 25px;
            background: rgba(30,41,59,0.9);
            border: 1px solid rgba(51,65,85,0.5);
            border-radius: 14px;
        }
        .logo-header img {
            height: 55px;
            border-radius: 8px;
        }
        .logo-header .structure-name {
            font-size: 0.95em;
            font-weight: 700;
            color: #e2e8f0;
            line-height: 1.3;
        }
        .logo-header .formateur {
            font-size: 0.8em;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head>

<body>
    <div class="container">
    <div class="logo-header">
      <img src="logo_uimm_placeholder.jpg" alt="Logo UIMM" />
      <div>
        <div class="structure-name">Pôle Formation UIMM - CVDL</div>
        <div class="formateur">Formateur : S. Jaubert</div>
      </div>
    </div>
        <div class="header">
            <div class="badge">Évaluation finale</div>
            <h1>📝 QCM — Capabilité & SPC</h1>
            <p>20 questions pour valider vos acquis des 2 jours de formation</p>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="pf"></div>
        </div>
        <form id="qf"></form>
        <button class="btn" id="btn" onclick="validate()" disabled>✅ Valider mes réponses</button>
        <div class="result" id="res">
            <div class="score-ring" id="sr"></div>
            <h2 id="rt"></h2>
            <p id="rx"></p>
            <div class="cat-scores" id="cs"></div>
        </div>
        <a href="index.html" class="back-link">← Retour aux ressources</a>
    </div>
    <script>
        const Q = [
            { c: "cap", q: "Que mesure l'indice Cp ?", o: ["Le centrage du procédé", "Le rapport entre tolérance et dispersion (6σ)", "Le nombre de pièces non conformes", "La stabilité dans le temps"], a: 1, e: "Cp = IT/6σ. Il compare la largeur de la tolérance à la dispersion naturelle du procédé." },
            { c: "cap", q: "Si Cp = 1,50 et Cpk = 0,90, quel est le problème ?", o: ["La dispersion est trop grande", "Le procédé est décentré", "La machine est en panne", "Les limites de spécification sont fausses"], a: 1, e: "Cp > Cpk signifie que le procédé a le potentiel (dispersion OK) mais qu'il est décentré. Il faut rerégler." },
            { c: "cap", q: "Quel seuil de Cpk est généralement requis en production série ?", o: ["≥ 0,67", "≥ 1,00", "≥ 1,33", "≥ 2,00"], a: 2, e: "Le seuil de 1,33 est le standard industriel. 1,67 est requis pour la qualification, et 2,00 correspond au Six Sigma." },
            { c: "cap", q: "Quelle est la différence entre σ̂ (sigma chapeau) et σ (sigma global) ?", o: ["σ̂ est toujours plus grand que σ", "σ̂ est estimé depuis les étendues (court terme), σ est calculé globalement (long terme)", "Il n'y a pas de différence", "σ̂ inclut les causes spéciales"], a: 1, e: "σ̂ = R̄/d₂ capture la variabilité intra-groupe (court terme). σ global inclut la variabilité inter-groupes (long terme)." },
            { c: "cap", q: "Si Pp est nettement inférieur à Cp, cela signifie que :", o: ["Le procédé est stable dans le temps", "Des causes spéciales dégradent la performance long terme", "La machine est plus capable que le procédé", "Les calculs sont faux"], a: 1, e: "Cp (court terme) > Pp (long terme) indique que des sources de variation supplémentaires apparaissent dans le temps." },
            { c: "cap", q: "L'indice Cmk est ≥ 1,67. Que peut-on conclure ?", o: ["Le procédé est validé pour la production série", "La machine est qualifiée (capable et centrée)", "Le client est satisfait", "Il faut augmenter la cadence"], a: 1, e: "Cmk ≥ 1,67 signifie que la machine est capable ET bien centrée dans des conditions optimales. C'est le seuil de qualification." },
            { c: "cc", q: "Que représentent les limites de contrôle (LCS/LCI) sur une carte de contrôle ?", o: ["Les tolérances du client", "Les limites à ±3σ de la moyenne du procédé", "Les limites de la machine", "Les objectifs de production"], a: 1, e: "LCS/LCI = X̿ ± 3σ. Ce sont les limites STATISTIQUES du procédé, pas les tolérances. Un point hors limites signale une cause spéciale." },
            { c: "cc", q: "Quelle constante utilise-t-on pour calculer la LCS de la carte X̄ avec n=5 ?", o: ["d₂ = 2,326", "A₂ = 0,577", "D₄ = 2,115", "d₃ = 0,864"], a: 1, e: "LCS(X̄) = X̿ + A₂ × R̄. Pour n=5, A₂ = 0,577." },
            { c: "cc", q: "La carte R surveille :", o: ["Le centrage du procédé", "La dispersion du procédé", "Les tolérances", "Le nombre de défauts"], a: 1, e: "La carte R (étendues) surveille la dispersion intra-groupe. La carte X̄ surveille le centrage." },
            { c: "cc", q: "Pourquoi faut-il d'abord analyser la carte R avant la carte X̄ ?", o: ["Par convention uniquement", "Car si R est instable, les limites de X̄ ne sont pas fiables", "Car R est plus facile à calculer", "Car R détecte le décentrage"], a: 1, e: "Les limites de la carte X̄ dépendent de R̄. Si la dispersion n'est pas stable, les limites de X̄ sont fausses." },
            { c: "cc", q: "Quand doit-on recalculer les limites de contrôle ?", o: ["Toutes les semaines", "À chaque changement de lot", "Uniquement si la variabilité intrinsèque du procédé a changé", "Jamais, elles sont définitives"], a: 2, e: "Les limites ne changent que si la variabilité court-terme (σ̂) change. Un simple déréglage ne justifie pas de recalcul." },
            { c: "cc", q: "Un procédé peut être sous contrôle statistique ET non capable. Vrai ou faux ?", o: ["Vrai : stable mais trop dispersé par rapport aux tolérances", "Faux : sous contrôle = capable", "Vrai seulement si Cp > 1", "Faux : c'est le contraire"], a: 0, e: "Un procédé sous contrôle = stable (causes communes seules). Mais sa dispersion peut être plus large que la tolérance → non capable." },
            { c: "att", q: "Quelle carte utilise-t-on pour suivre le nombre de pièces défectueuses par lot (taille de lot constante) ?", o: ["Carte X̄-R", "Carte p", "Carte np", "Carte c"], a: 2, e: "Carte np = nombre de non conformes avec taille constante. Carte p = proportion (taille variable)." },
            { c: "att", q: "La carte c est basée sur quelle loi de probabilité ?", o: ["Loi normale", "Loi binomiale", "Loi de Poisson", "Loi uniforme"], a: 2, e: "La carte c (comptage de défauts) suit la loi de Poisson. La carte p/np suit la loi binomiale." },
            { c: "att", q: "Quelle est la différence principale entre carte p et carte c ?", o: ["p compte les pièces défectueuses, c compte les défauts par unité", "p est pour les petits lots, c pour les grands", "p utilise σ, c utilise R̄", "Il n'y a pas de différence"], a: 0, e: "p/np = pièce OK ou NON (binaire). c/u = nombre de défauts par unité (une pièce peut avoir plusieurs défauts)." },
            { c: "att", q: "Les cartes aux attributs nécessitent des échantillons plus grands que les cartes aux mesures. Pourquoi ?", o: ["Car les attributs sont moins précis et moins sensibles", "Car les attributs nécessitent des machines spéciales", "Car la loi normale ne s'applique pas", "Car c'est imposé par la norme ISO"], a: 0, e: "Les données d'attributs sont discrètes et moins informatives. Il faut plus de données pour détecter un changement significatif." },
            { c: "int", q: "7 points consécutifs au-dessus de la ligne centrale : quelle règle est violée ?", o: ["Règle 1 (point hors limites)", "Règle 4 (run/série)", "Règle 5 (tendance)", "Règle 7 (stratification)"], a: 1, e: "Règle 4 : 7 ou 8 points du même côté de la ligne centrale. Cela signale un changement de niveau (opérateur, matière, outil…)." },
            { c: "int", q: "14 points alternant haut-bas-haut-bas : quelle est la cause probable ?", o: ["Usure de l'outil", "Sur-contrôle de l'opérateur (tampering)", "Deux machines mélangées", "Dérive thermique"], a: 1, e: "Règle 8 (over-control) : l'opérateur ajuste trop fréquemment un procédé qui était déjà sous contrôle, créant une oscillation artificielle." },
            { c: "int", q: "Tous les points dans les limites mais 15 consécutifs en zone C : est-ce normal ?", o: ["Oui, c'est un procédé très stable", "Non, c'est la règle 7 (stratification) — les sous-groupes mélangent probablement des sources différentes", "Oui, c'est l'objectif", "Non, les limites sont trop larges"], a: 1, e: "Règle 7 : si tous les points collent à la moyenne, les sous-groupes sont probablement trop hétérogènes (limites artificiellement larges)." },
            { c: "int", q: "Une carte de contrôle détecte QUAND un procédé change. Pour trouver POURQUOI, on utilise :", o: ["Une autre carte de contrôle", "Les outils de résolution de problèmes (5M, Ishikawa, 5 Pourquoi…)", "Un test de normalité", "Un calcul de Cpk"], a: 1, e: "La carte de contrôle est un système d'alarme. L'investigation de la cause spéciale nécessite des outils comme le diagramme d'Ishikawa ou les 5 Pourquoi." }
        ];
        const cats = { cap: "Capabilité", cc: "Cartes mesures", att: "Cartes attributs", int: "Interprétation" };
        const catCls = { cap: "cat-cap", cc: "cat-cc", att: "cat-att", int: "cat-int" };
        let ua = {}, done = false;
        const form = document.getElementById('qf');
        Q.forEach((q, i) => {
            const n = i + 1;
            let h = `<div class="question-card" id="q${n}"><div class="q-header"><span class="q-number">${n}</span><span class="q-cat ${catCls[q.c]}">${cats[q.c]}</span></div><div class="q-text">${q.q}</div><div class="options">`;
            q.o.forEach((o, j) => { h += `<label class="option" onclick="sel(this,${n},${j})"><span class="radio"></span><span>${o}</span></label>`; });
            h += `</div><div class="exp" id="e${n}"></div></div>`;
            form.innerHTML += h;
        });
        function sel(el, n, j) {
            if (done) return;
            const c = document.getElementById('q' + n);
            c.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            ua[n] = j;
            document.getElementById('pf').style.width = (Object.keys(ua).length / 20 * 100) + '%';
            document.getElementById('btn').disabled = Object.keys(ua).length < 20;
        }
        function validate() {
            if (Object.keys(ua).length < 20) return;
            done = true;
            let s = 0, cs = { cap: 0, cc: 0, att: 0, int: 0 }, ct = { cap: 0, cc: 0, att: 0, int: 0 };
            Q.forEach((q, i) => {
                const n = i + 1, c = document.getElementById('q' + n), opts = c.querySelectorAll('.option');
                ct[q.c]++;
                opts[q.a].classList.add('right');
                if (ua[n] === q.a) { s++; cs[q.c]++; c.classList.add('correct'); document.getElementById('e' + n).className = 'exp show ok'; document.getElementById('e' + n).innerHTML = '✅ ' + q.e; }
                else { opts[ua[n]].classList.add('wrong'); c.classList.add('incorrect'); document.getElementById('e' + n).className = 'exp show ko'; document.getElementById('e' + n).innerHTML = '❌ ' + q.e; }
            });
            const r = document.getElementById('res'), sr = document.getElementById('sr');
            sr.textContent = s + '/20';
            sr.className = 'score-ring ' + (s >= 16 ? 'g' : s >= 10 ? 'm' : 'l');
            document.getElementById('rt').textContent = s >= 16 ? '🏆 Excellent !' : s >= 10 ? '👍 Résultat satisfaisant' : '📚 À consolider';
            document.getElementById('rx').textContent = s >= 16 ? 'Vous maîtrisez les fondamentaux du SPC et de la capabilité.' : s >= 10 ? 'Bonnes bases. Revoyez les points manqués pour consolider.' : 'Certains concepts nécessitent une révision. Utilisez l\'aide-mémoire !';
            let ch = '';
            for (let k in cats) { ch += `<div class="cat-score"><div class="label">${cats[k]}</div><div class="val" style="color:${cs[k] === ct[k] ? '#4ade80' : cs[k] >= ct[k] / 2 ? '#fbbf24' : '#f87171'}">${cs[k]}/${ct[k]}</div></div>`; }
            document.getElementById('cs').innerHTML = ch;
            r.classList.add('show');
            document.getElementById('btn').style.display = 'none';
            r.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>

</html>
